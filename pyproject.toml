[project]
name = "distributed-vae"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anndata>=0.11.4",
    "jupyter>=1.1.1",
    "jupytext>=1.17.1",
    "matplotlib>=3.10.3",
    "mlx>=0.26.1",
    "numpy>=2.2.6",
    "scikit-learn>=1.6.1",
    "toml>=0.10.2",
    "toolz>=1.0.0",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "tqdm>=4.67.1",
    "wandb>=0.19.11",
]

[project.scripts]
switch = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
